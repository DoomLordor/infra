bind 0.0.0.0
protected-mode yes
port 6379

# Cluster
cluster-enabled yes
cluster-config-file /data/nodes.conf
cluster-node-timeout 5000
cluster-require-full-coverage yes
cluster-migration-barrier 1
cluster-preferred-endpoint-type hostname

# Persistence: RDB + AOF for a stronger durability baseline.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 900 1
save 300 10
save 60 10000

# Memory policy: do not silently evict DB-like data by default.
maxmemory-policy noeviction

# Operational hardening.
tcp-keepalive 300
timeout 0
loglevel notice
dir /data
