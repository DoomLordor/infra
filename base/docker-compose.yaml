name: infra-base

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  storage-init:
    image: alpine:3.22.1
    restart: "no"
    user: "0:0"
    network_mode: none
    command: ["/bin/sh", "/usr/local/bin/storage-init.sh"]
    volumes:
      - ./storage-init.sh:/usr/local/bin/storage-init.sh:ro
      - ${DATA_ROOT}/postgres:/data/postgres
      - ${DATA_ROOT}/clickhouse:/data/clickhouse
      - ${DATA_ROOT}/clickhouse-logs:/data/clickhouse-logs
      - ${DATA_ROOT}/redis-0:/data/redis-0
      - ${DATA_ROOT}/redis-1:/data/redis-1
      - ${DATA_ROOT}/redis-2:/data/redis-2
      - ${DATA_ROOT}/redis-standalone:/data/redis-standalone
      - ${DATA_ROOT}/kafka:/data/kafka
      - ${DATA_ROOT}/prometheus:/data/prometheus
      - ${DATA_ROOT}/traefik:/data/traefik
      - ${DATA_ROOT}/jaeger:/data/jaeger
      - ${DATA_ROOT}/minio:/data/minio
      - ${DATA_ROOT}/loki:/data/loki
      - ${DATA_ROOT}/alloy:/data/alloy
    logging: *default-logging

  traefik:
    image: traefik:v3.7.10
    restart: unless-stopped
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --log.format=json
      - --accesslog.format=json
      - --ping.entrypoint=traefik
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=900s
      - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=0s
      - --entrypoints.websecure.transport.respondingtimeouts.idletimeout=900s
      - --entrypoints.traefik.address=:8080
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=infra
      - --certificatesresolvers.stepca.acme.caserver=https://${STEP_CA_HOST}/acme/acme/directory
      - --certificatesresolvers.stepca.acme.email=${STEP_CA_EMAIL}
      - --certificatesresolvers.stepca.acme.storage=/var/lib/traefik/acme.json
      - --certificatesresolvers.stepca.acme.certificatesduration=${STEP_CA_CERT_DURATION_HOURS}
      - --certificatesresolvers.stepca.acme.tlschallenge=true
    environment:
      LEGO_CA_CERTIFICATES: /etc/step-ca/root_ca.crt
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/certs:/etc/step-ca:ro
      - ${DATA_ROOT}/traefik:/var/lib/traefik
    ports:
      - "${LAN_BIND_IP}:80:80"
      - "${LAN_BIND_IP}:443:443"
    networks:
      infra:
        # OIDC clients use Keycloak's external issuer without hairpinning through the LAN IP.
        aliases: ["keycloak.${SERVER_NAME}", "gitlab.${SERVER_NAME}"]
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: ${TRAEFIK_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    secrets:
      - postgres_password
      - postgres_monitor_password
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${LAN_BIND_IP}:5432:5432"
    networks: [infra]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb
    mem_limit: ${POSTGRES_MEMORY_LIMIT}
    stop_grace_period: 60s
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.110
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/clickhouse-secrets-entrypoint.sh"]
    depends_on:
      storage-init:
        condition: service_completed_successfully
    secrets:
      - clickhouse_admin_password
      - clickhouse_app_password
    volumes:
      - ${DATA_ROOT}/clickhouse:/var/lib/clickhouse
      - ${DATA_ROOT}/clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/config.d/production.xml:/etc/clickhouse-server/config.d/production.xml:ro
      - ./clickhouse/users.d/production.xml:/etc/clickhouse-server/users.d/production.xml:ro
      - ./clickhouse/secrets-entrypoint.sh:/usr/local/bin/clickhouse-secrets-entrypoint.sh:ro
    ports:
      - "${LAN_BIND_IP}:9000:9000"
    networks: [infra]
    labels:
      - traefik.enable=true
      - traefik.http.routers.clickhouse.rule=Host(`clickhouse.${SERVER_NAME}`)
      - traefik.http.routers.clickhouse.entrypoints=websecure
      - traefik.http.routers.clickhouse.tls=true
      - traefik.http.routers.clickhouse.tls.certresolver=stepca
      - traefik.http.routers.clickhouse.service=clickhouse-http
      - traefik.http.services.clickhouse-http.loadbalancer.server.port=8123
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host", "127.0.0.1", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: ${CLICKHOUSE_MEMORY_LIMIT}
    stop_grace_period: 90s
    logging: *default-logging

  redis-node-0:
    image: redis:8.2.8-bookworm
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    command: ["/usr/local/bin/cluster-entrypoint.sh", "redis-node-0"]
    environment:
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY}
    secrets: [redis_password]
    volumes:
      - ${DATA_ROOT}/redis-0:/data
      - ./redis/cluster.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
    networks: [infra]
    healthcheck: &redis-healthcheck
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: ${REDIS_NODE_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  redis-node-1:
    image: redis:8.2.8-bookworm
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    command: ["/usr/local/bin/cluster-entrypoint.sh", "redis-node-1"]
    environment:
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY}
    secrets: [redis_password]
    volumes:
      - ${DATA_ROOT}/redis-1:/data
      - ./redis/cluster.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
    networks: [infra]
    healthcheck: *redis-healthcheck
    mem_limit: ${REDIS_NODE_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  redis-node-2:
    image: redis:8.2.8-bookworm
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    command: ["/usr/local/bin/cluster-entrypoint.sh", "redis-node-2"]
    environment:
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY}
    secrets: [redis_password]
    volumes:
      - ${DATA_ROOT}/redis-2:/data
      - ./redis/cluster.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
    networks: [infra]
    healthcheck: *redis-healthcheck
    mem_limit: ${REDIS_NODE_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  redis-cluster-init:
    image: redis:8.2.8-bookworm
    restart: "no"
    depends_on:
      redis-node-0: {condition: service_healthy}
      redis-node-1: {condition: service_healthy}
      redis-node-2: {condition: service_healthy}
    secrets: [redis_password]
    volumes:
      - ./redis/init-cluster.sh:/usr/local/bin/init-cluster.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/init-cluster.sh"]
    networks: [infra]
    logging: *default-logging

  redis-standalone:
    image: redis:7.2.15-bookworm
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/redis-standalone-entrypoint.sh"]
    environment:
      REDIS_STANDALONE_MAXMEMORY: ${REDIS_STANDALONE_MAXMEMORY}
    secrets:
      - redis_standalone_password
    volumes:
      - ${DATA_ROOT}/redis-standalone:/data
      - ./redis/standalone.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/standalone-entrypoint.sh:/usr/local/bin/redis-standalone-entrypoint.sh:ro
    networks: [infra]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -a \"$$(cat /run/secrets/redis_standalone_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: ${REDIS_STANDALONE_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,LAN://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,LAN://${LAN_BIND_IP}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,LAN:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ${DATA_ROOT}/kafka:/var/lib/kafka/data
    ports:
      - "${LAN_BIND_IP}:9092:29092"
    networks: [infra]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "127.0.0.1:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: ${KAFKA_MEMORY_LIMIT}
    stop_grace_period: 60s
    logging: *default-logging

  nats:
    image: nats:2.14.5-alpine
    restart: unless-stopped
    ports:
      - "${LAN_BIND_IP}:4222:4222"
    networks: [infra]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: ${NATS_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    depends_on:
      storage-init: {condition: service_completed_successfully}
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - ${DATA_ROOT}/minio:/data
    networks: [infra]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: ${MINIO_MEMORY_LIMIT:-512m}
    stop_grace_period: 60s
    logging: *default-logging

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-03-12T17-29-24Z
    restart: "no"
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-init.sh"]
    secrets:
      - minio_root_user
      - minio_root_password
      - loki_s3_secret_key
    volumes:
      - ./minio/init.sh:/usr/local/bin/minio-init.sh:ro
    networks: [infra]
    logging: *default-logging

  loki:
    image: grafana/loki:3.5.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
    depends_on:
      minio-init: {condition: service_completed_successfully}
    env_file:
      - ../secrets/loki.env
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-30d}
    volumes:
      - ${DATA_ROOT}/loki:/loki
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
    networks: [infra]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: ${LOKI_MEMORY_LIMIT:-1g}
    stop_grace_period: 60s
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.8.3
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      loki: {condition: service_healthy}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT}/alloy:/var/lib/alloy
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    networks: [infra]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: ${ALLOY_MEMORY_LIMIT:-512m}
    stop_grace_period: 30s
    logging: *default-logging

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    restart: unless-stopped
    command: ["--config=/etc/jaeger/config.yaml"]
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      GOMEMLIMIT: 800MiB
    volumes:
      - ${DATA_ROOT}/jaeger:/var/lib/jaeger
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    networks: [infra]
    labels:
      - traefik.enable=true
      - traefik.http.routers.jaeger.rule=Host(`jaeger.${SERVER_NAME}`)
      - traefik.http.routers.jaeger.entrypoints=websecure
      - traefik.http.routers.jaeger.tls=true
      - traefik.http.routers.jaeger.tls.certresolver=stepca
      - traefik.http.routers.jaeger.service=jaeger
      - traefik.http.services.jaeger.loadbalancer.server.port=16686
      - traefik.http.services.jaeger.loadbalancer.healthcheck.path=/status
      - traefik.http.services.jaeger.loadbalancer.healthcheck.port=13133
      - traefik.http.services.jaeger.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.jaeger.loadbalancer.healthcheck.timeout=5s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:13133/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: ${JAEGER_MEMORY_LIMIT}
    stop_grace_period: 60s
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    env_file:
      - ../secrets/otel.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./otel/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [infra]
    labels:
      - traefik.enable=true
      - traefik.http.routers.otel-http.rule=Host(`otel-http.${SERVER_NAME}`)
      - traefik.http.routers.otel-http.entrypoints=websecure
      - traefik.http.routers.otel-http.tls=true
      - traefik.http.routers.otel-http.tls.certresolver=stepca
      - traefik.http.routers.otel-http.service=otel-http
      - traefik.http.services.otel-http.loadbalancer.server.port=4318
      - traefik.http.routers.otel-grpc.rule=Host(`otel-grpc.${SERVER_NAME}`)
      - traefik.http.routers.otel-grpc.entrypoints=websecure
      - traefik.http.routers.otel-grpc.tls=true
      - traefik.http.routers.otel-grpc.tls.certresolver=stepca
      - traefik.http.routers.otel-grpc.service=otel-grpc
      - traefik.http.services.otel-grpc.loadbalancer.server.port=4317
      - traefik.http.services.otel-grpc.loadbalancer.server.scheme=h2c
    depends_on:
      postgres: {condition: service_healthy}
      redis-cluster-init: {condition: service_completed_successfully}
      jaeger: {condition: service_healthy}
    mem_limit: ${OTEL_MEMORY_LIMIT}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    depends_on:
      storage-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_started}
      clickhouse: {condition: service_healthy}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE}
    volumes:
      - ${DATA_ROOT}/prometheus:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [infra]
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${SERVER_NAME}`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls=true
      - traefik.http.routers.prometheus.tls.certresolver=stepca
      - traefik.http.routers.prometheus.service=prometheus
      - traefik.http.routers.prometheus.middlewares=infra-sso-errors@docker,infra-sso@docker
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT}
    stop_grace_period: 60s
    logging: *default-logging

secrets:
  postgres_password:
    file: ../secrets/postgres_password
  postgres_monitor_password:
    file: ../secrets/postgres_monitor_password
  redis_password:
    file: ../secrets/redis_password
  redis_standalone_password:
    file: ../secrets/redis_standalone_password
  clickhouse_admin_password:
    file: ../secrets/clickhouse_admin_password
  clickhouse_app_password:
    file: ../secrets/clickhouse_app_password
  minio_root_user:
    file: ../secrets/minio_root_user
  minio_root_password:
    file: ../secrets/minio_root_password
  loki_s3_secret_key:
    file: ../secrets/loki_s3_secret_key

networks:
  infra:
    name: infra
    driver: bridge
