listen_addresses = '*'
port = 5432
max_connections = 400
shared_buffers = '512MB'
work_mem = '8MB'
maintenance_work_mem = '64MB'
password_encryption = 'scram-sha-256'

# Required for pg_stat_statements.
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = 'auto'
track_io_timing = on

# Operational safety / observability.
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10485760
deadlock_timeout = '1s'
idle_in_transaction_session_timeout = '5min'
statement_timeout = '60s'

# WAL/checkpoint baseline. Tune to storage and write rate.
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = '4GB'
min_wal_size = '1GB'

# Keep timestamps consistent across the stack.
timezone = 'UTC'
log_timezone = 'UTC'
