global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: otel-exported-metrics
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: ["clickhouse:9363"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: harbor
    static_configs:
      - targets:
          - harbor-core:9090
          - harbor-jobservice:9090
          - harbor-registry:9090
          - harbor-exporter:8080

  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:8888"]
