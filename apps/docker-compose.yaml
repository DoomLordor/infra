name: infra-apps

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  storage-init:
    image: alpine:3.22.1
    restart: "no"
    user: "0:0"
    network_mode: none
    command: ["/bin/sh", "/usr/local/bin/storage-init.sh"]
    volumes:
      - ./storage-init.sh:/usr/local/bin/storage-init.sh:ro
      - ../base/traefik/certs/root_ca.crt:/etc/step-ca/root_ca.crt:ro
      - ${DATA_ROOT}/grafana:/data/grafana
      - ${DATA_ROOT}/vault:/data/vault
      - ${DATA_ROOT}/harbor:/data/harbor
      - ${DATA_ROOT}/gitlab:/data/gitlab
      - ${DATA_ROOT}/gitlab-runner:/data/gitlab-runner
    logging: *default-logging

  base-ready:
    image: postgres:17.11-bookworm
    restart: "no"
    entrypoint: ["/bin/bash", "/usr/local/bin/base-ready.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - ./base-ready.sh:/usr/local/bin/base-ready.sh:ro
    networks: [infra]
    logging: *default-logging

  postgres-init:
    image: postgres:17.11-bookworm
    restart: "no"
    depends_on:
      base-ready:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/usr/local/bin/postgres-init.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
    secrets:
      - postgres_password
      - grafana_db_password
      - keycloak_db_password
      - harbor_db_password
      - gitlab_db_password
    volumes:
      - ./postgres-init.sh:/usr/local/bin/postgres-init.sh:ro
    networks: [infra]
    logging: *default-logging

  vault:
    image: hashicorp/vault:2.0.4
    restart: unless-stopped
    command: ["server"]
    depends_on:
      storage-init:
        condition: service_completed_successfully
      base-ready:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: https://vault.${SERVER_NAME}
      SERVER_NAME: ${SERVER_NAME}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
    secrets:
      - vault_oidc_client_secret
    volumes:
      - ${DATA_ROOT}/vault:/vault/file
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
      - ./vault/policies:/vault/policies:ro
      - ./vault/oidc-bootstrap.sh:/usr/local/bin/vault-oidc-configure.sh:ro
      - ../base/traefik/certs:/etc/step-ca:ro
    networks: [infra]
    labels:
      - traefik.enable=true
      - traefik.http.routers.vault.rule=Host(`vault.${SERVER_NAME}`)
      - traefik.http.routers.vault.entrypoints=websecure
      - traefik.http.routers.vault.tls=true
      - traefik.http.routers.vault.tls.certresolver=stepca
      - traefik.http.routers.vault.service=vault
      - traefik.http.services.vault.loadbalancer.server.port=8200
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: ${VAULT_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    restart: unless-stopped
    command: ["--config-file=/run/secrets/keycloak.conf", "start", "--import-realm"]
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://keycloak.${SERVER_NAME}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
    secrets:
      - source: keycloak_config
        target: keycloak.conf
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/${KEYCLOAK_REALM}-realm.json:ro
    networks: [infra]
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`keycloak.${SERVER_NAME}`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.routers.keycloak.tls.certresolver=stepca
      - traefik.http.routers.keycloak.service=keycloak
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "bash", "-ec", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: ${KEYCLOAK_MEMORY_LIMIT}
    stop_grace_period: 60s
    logging: *default-logging

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.7.1
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/usr/local/bin/keycloak-bootstrap.sh"]
    environment:
      SERVER_NAME: ${SERVER_NAME}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
    secrets:
      - keycloak_admin_password
      - keycloak_bootstrap_client_secret
      - gitlab_oidc_client_secret
      - grafana_oidc_client_secret
      - harbor_oidc_client_secret
      - vault_oidc_client_secret
      - oauth2_proxy_client_secret
    volumes:
      - ./keycloak/bootstrap.sh:/usr/local/bin/keycloak-bootstrap.sh:ro
    networks: [infra]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging: *default-logging

  gitlab:
    image: gitlab/gitlab-ce:19.2.2-ce.0
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      base-ready:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully
      keycloak-bootstrap:
        condition: service_completed_successfully
    environment:
      SERVER_NAME: ${SERVER_NAME}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      GITLAB_SSH_PORT: ${GITLAB_SSH_PORT}
    secrets:
      - gitlab_db_password
      - redis_standalone_password
      - gitlab_root_password
      - gitlab_oidc_client_secret
    volumes:
      - ${DATA_ROOT}/gitlab/config:/etc/gitlab
      - ${DATA_ROOT}/gitlab/logs:/var/log/gitlab
      - ${DATA_ROOT}/gitlab/data:/var/opt/gitlab
      - ./gitlab/gitlab.rb:/etc/gitlab/gitlab.rb:ro
    ports:
      - "${LAN_BIND_IP}:${GITLAB_SSH_PORT}:22"
    networks: [infra]
    labels:
      - traefik.enable=true
      - traefik.http.routers.gitlab.rule=Host(`gitlab.${SERVER_NAME}`)
      - traefik.http.routers.gitlab.entrypoints=websecure
      - traefik.http.routers.gitlab.tls=true
      - traefik.http.routers.gitlab.tls.certresolver=stepca
      - traefik.http.routers.gitlab.service=gitlab
      - traefik.http.services.gitlab.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "curl", "-fSs", "--max-time", "10", "-H", "Host: gitlab.${SERVER_NAME}", "http://127.0.0.1/-/readiness?all=1"]
      interval: 30s
      timeout: 20s
      retries: 20
      start_period: 5m
    shm_size: 256mb
    mem_limit: ${GITLAB_MEMORY_LIMIT}
    stop_grace_period: 120s
    logging: *default-logging

  gitlab-runner:
    image: gitlab/gitlab-runner:v18.1.0
    profiles: [ci]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/gitlab-runner-entrypoint.sh"]
    depends_on:
      storage-init:
        condition: service_completed_successfully
      gitlab:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME}
      RUNNER_CACHE_HOST_PATH: ${DATA_ROOT}/gitlab-runner/cache
    secrets:
      - gitlab_runner_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT}/gitlab-runner/config:/etc/gitlab-runner
      - ${DATA_ROOT}/gitlab-runner/cache:/cache
      - ../base/traefik/certs/root_ca.crt:/etc/gitlab-runner/certs/gitlab.${SERVER_NAME}.crt:ro
      - ./gitlab-runner/entrypoint.sh:/usr/local/bin/gitlab-runner-entrypoint.sh:ro
    networks: [infra]
    mem_limit: ${GITLAB_RUNNER_MEMORY_LIMIT:-1g}
    stop_grace_period: 30s
    logging: *default-logging

  harbor-registry:
    image: goharbor/registry-photon:v2.15.2
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      base-ready:
        condition: service_completed_successfully
    volumes:
      - ${DATA_ROOT}/harbor/registry:/storage
      - ../secrets/harbor-registry-config.yml:/etc/registry/config.yml:ro
      - ../secrets/harbor_registry_passwd:/etc/registry/passwd:ro
      - ../secrets/harbor_registry_root.crt:/etc/registry/root.crt:ro
    networks: [infra]
    mem_limit: ${HARBOR_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  harbor-registryctl:
    image: goharbor/harbor-registryctl:v2.15.2
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      base-ready:
        condition: service_completed_successfully
    env_file:
      - ../secrets/harbor-registryctl.env
    volumes:
      - ${DATA_ROOT}/harbor/registry:/storage
      - ../secrets/harbor-registry-config.yml:/etc/registry/config.yml:ro
      - ../secrets/harbor_registry_passwd:/etc/registry/passwd:ro
      - ./harbor/registryctl/config.yml:/etc/registryctl/config.yml:ro
    networks: [infra]
    mem_limit: ${HARBOR_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  harbor-core:
    image: goharbor/harbor-core:v2.15.2
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      harbor-registry:
        condition: service_healthy
      harbor-registryctl:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
    env_file:
      - ../secrets/harbor-core.env
    environment:
      CONFIG_PATH: /etc/core/app.conf
      LOG_LEVEL: info
      EXT_ENDPOINT: https://harbor.${SERVER_NAME}
      DATABASE_TYPE: postgresql
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: harbor
      POSTGRESQL_DATABASE: registry
      POSTGRESQL_SSLMODE: disable
      POSTGRESQL_MAX_IDLE_CONNS: 2
      POSTGRESQL_MAX_OPEN_CONNS: 50
      POSTGRESQL_CONN_MAX_LIFETIME: 5m
      POSTGRESQL_CONN_MAX_IDLE_TIME: 0
      REGISTRY_URL: http://harbor-registry:5000
      PORTAL_URL: http://harbor-portal:8080
      TOKEN_SERVICE_URL: http://harbor-core:8080/service/token
      MAX_JOB_WORKERS: 10
      WITH_TRIVY: "true"
      CORE_URL: http://harbor-core:8080
      CORE_LOCAL_URL: http://127.0.0.1:8080
      JOBSERVICE_URL: http://harbor-jobservice:8080
      TRIVY_ADAPTER_URL: http://harbor-trivy:8080
      REGISTRY_STORAGE_PROVIDER_NAME: filesystem
      READ_ONLY: "false"
      REGISTRY_CONTROLLER_URL: http://harbor-registryctl:8080
      REGISTRY_CREDENTIAL_USERNAME: harbor_registry_user
      ROBOT_SCANNER_NAME_PREFIX: harborsc
      QUOTA_UPDATE_PROVIDER: db
      PORT: 8080
      METRIC_ENABLE: "true"
      METRIC_PATH: /metrics
      METRIC_PORT: 9090
      METRIC_NAMESPACE: harbor
      METRIC_SUBSYSTEM: core
      SSL_CERT_DIR: /etc/step-ca
    volumes:
      - ${DATA_ROOT}/harbor:/data
      - ${DATA_ROOT}/harbor/ca-download:/etc/core/ca
      - ./harbor/core/app.conf:/etc/core/app.conf:ro
      - ../secrets/harbor_core_private_key.pem:/etc/core/private_key.pem:ro
      - ../secrets/harbor_secret_key:/etc/core/key:ro
      - ../base/traefik/certs:/etc/step-ca:ro
    networks: [infra]
    labels:
      - traefik.enable=true
      - "traefik.http.routers.harbor-core.rule=Host(`harbor.${SERVER_NAME}`) && (PathPrefix(`/c/`) || PathPrefix(`/api/`) || PathPrefix(`/v2/`) || (PathPrefix(`/service/`) && !PathPrefix(`/service/notifications`)))"
      - traefik.http.routers.harbor-core.priority=100
      - traefik.http.routers.harbor-core.entrypoints=websecure
      - traefik.http.routers.harbor-core.tls=true
      - traefik.http.routers.harbor-core.tls.certresolver=stepca
      - traefik.http.routers.harbor-core.middlewares=harbor-security-headers@docker
      - traefik.http.routers.harbor-core.service=harbor-core
      - traefik.http.services.harbor-core.loadbalancer.server.port=8080
      - traefik.http.services.harbor-core.loadbalancer.healthcheck.path=/api/v2.0/health
      - traefik.http.services.harbor-core.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.harbor-core.loadbalancer.healthcheck.timeout=5s
    mem_limit: ${HARBOR_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  harbor-oidc-init:
    image: goharbor/harbor-core:v2.15.2
    restart: "no"
    depends_on:
      harbor-core:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/usr/local/bin/configure-harbor-oidc.sh"]
    environment:
      SERVER_NAME: ${SERVER_NAME}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
    secrets:
      - harbor_admin_password
      - harbor_oidc_client_secret
    volumes:
      - ./harbor/configure-oidc.sh:/usr/local/bin/configure-harbor-oidc.sh:ro
    networks: [infra]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging: *default-logging

  harbor-portal:
    image: goharbor/harbor-portal:v2.15.2
    restart: unless-stopped
    depends_on:
      harbor-core:
        condition: service_healthy
      harbor-oidc-init:
        condition: service_completed_successfully
    volumes:
      - ./harbor/portal/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [infra]
    labels:
      - traefik.enable=true
      - "traefik.http.routers.harbor-portal.rule=Host(`harbor.${SERVER_NAME}`) && !PathPrefix(`/v1/`) && !PathPrefix(`/service/notifications`)"
      - traefik.http.routers.harbor-portal.priority=10
      - traefik.http.routers.harbor-portal.entrypoints=websecure
      - traefik.http.routers.harbor-portal.tls=true
      - traefik.http.routers.harbor-portal.tls.certresolver=stepca
      - traefik.http.routers.harbor-portal.middlewares=harbor-security-headers@docker
      - traefik.http.routers.harbor-portal.service=harbor-portal
      - traefik.http.services.harbor-portal.loadbalancer.server.port=8080
      - traefik.http.services.harbor-portal.loadbalancer.healthcheck.path=/
      - traefik.http.services.harbor-portal.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.harbor-portal.loadbalancer.healthcheck.timeout=5s
      - traefik.http.middlewares.harbor-security-headers.headers.frameDeny=true
      - traefik.http.middlewares.harbor-security-headers.headers.contentSecurityPolicy=frame-ancestors 'none'
    mem_limit: ${HARBOR_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  harbor-jobservice:
    image: goharbor/harbor-jobservice:v2.15.2
    restart: unless-stopped
    depends_on:
      base-ready:
        condition: service_completed_successfully
      harbor-core:
        condition: service_healthy
    env_file:
      - ../secrets/harbor-jobservice.env
    environment:
      REGISTRY_URL: http://harbor-registry:5000
      CORE_URL: http://harbor-core:8080
      REGISTRY_CONTROLLER_URL: http://harbor-registryctl:8080
      JOBSERVICE_WEBHOOK_JOB_MAX_RETRY: 3
      JOBSERVICE_WEBHOOK_JOB_HTTP_CLIENT_TIMEOUT: 3
      LOG_LEVEL: info
      REGISTRY_CREDENTIAL_USERNAME: harbor_registry_user
      METRIC_NAMESPACE: harbor
      METRIC_SUBSYSTEM: jobservice
    volumes:
      - ${DATA_ROOT}/harbor/job-logs:/var/log/jobs
      - ../secrets/harbor-jobservice-config.yml:/etc/jobservice/config.yml:ro
    networks: [infra]
    mem_limit: ${HARBOR_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  harbor-trivy:
    image: goharbor/trivy-adapter-photon:v2.15.2
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
      base-ready:
        condition: service_completed_successfully
    env_file:
      - ../secrets/harbor-trivy.env
    environment:
      SCANNER_LOG_LEVEL: info
      SCANNER_STORE_REDIS_NAMESPACE: harbor.scanner.trivy:store
      SCANNER_JOB_QUEUE_REDIS_NAMESPACE: harbor.scanner.trivy:job-queue
      SCANNER_TRIVY_CACHE_DIR: /home/scanner/.cache/trivy
      SCANNER_TRIVY_REPORTS_DIR: /home/scanner/.cache/reports
      SCANNER_TRIVY_VULN_TYPE: os,library
      SCANNER_TRIVY_SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      SCANNER_TRIVY_IGNORE_UNFIXED: "false"
      SCANNER_TRIVY_SKIP_UPDATE: "false"
      SCANNER_TRIVY_SKIP_JAVA_DB_UPDATE: "false"
      SCANNER_TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
      SCANNER_TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db
      SCANNER_TRIVY_OFFLINE_SCAN: "false"
      SCANNER_TRIVY_SECURITY_CHECKS: vuln
      SCANNER_TRIVY_GITHUB_TOKEN: ""
      SCANNER_TRIVY_INSECURE: "false"
      SCANNER_TRIVY_TIMEOUT: 5m0s
    volumes:
      - ${DATA_ROOT}/harbor/trivy:/home/scanner/.cache/trivy
      - ${DATA_ROOT}/harbor/trivy/reports:/home/scanner/.cache/reports
    networks: [infra]
    mem_limit: ${HARBOR_TRIVY_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  harbor-exporter:
    image: goharbor/harbor-exporter:v2.15.2
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      base-ready:
        condition: service_completed_successfully
      harbor-core:
        condition: service_healthy
    env_file:
      - ../secrets/harbor-exporter.env
    environment:
      LOG_LEVEL: info
      HARBOR_EXPORTER_PORT: 8080
      HARBOR_EXPORTER_METRICS_PATH: /metrics
      HARBOR_EXPORTER_METRICS_ENABLED: "true"
      HARBOR_EXPORTER_MAX_REQUESTS: 30
      HARBOR_EXPORTER_CACHE_TIME: 23
      HARBOR_EXPORTER_CACHE_CLEAN_INTERVAL: 14400
      HARBOR_METRIC_NAMESPACE: harbor
      HARBOR_METRIC_SUBSYSTEM: exporter
      HARBOR_SERVICE_HOST: harbor-core
      HARBOR_SERVICE_PORT: 8080
      HARBOR_SERVICE_SCHEME: http
      HARBOR_REDIS_NAMESPACE: harbor_job_service_namespace
      HARBOR_REDIS_TIMEOUT: 3600
      HARBOR_DATABASE_HOST: postgres
      HARBOR_DATABASE_PORT: 5432
      HARBOR_DATABASE_USERNAME: harbor
      HARBOR_DATABASE_DBNAME: registry
      HARBOR_DATABASE_SSLMODE: disable
      HARBOR_DATABASE_MAX_IDLE_CONNS: 2
      HARBOR_DATABASE_MAX_OPEN_CONNS: 50
      HARBOR_DATABASE_CONN_MAX_LIFETIME: 5m
      HARBOR_DATABASE_CONN_MAX_IDLE_TIME: 0
    networks: [infra]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s http://127.0.0.1:8080/metrics >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: ${HARBOR_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    restart: unless-stopped
    depends_on:
      keycloak-bootstrap:
        condition: service_completed_successfully
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --provider-display-name=Keycloak
      - --oidc-issuer-url=https://keycloak.${SERVER_NAME}/realms/${KEYCLOAK_REALM}
      - --client-id=infra-forward-auth
      - --client-secret-file=/run/secrets/oauth2_proxy_client_secret
      - --cookie-secret-file=/run/secrets/oauth2_proxy_cookie_secret
      - --redirect-url=https://oauth.${SERVER_NAME}/oauth2/callback
      - --scope=openid profile email groups
      - --code-challenge-method=S256
      - --email-domain=*
      - --allowed-group=/observability
      - --reverse-proxy=true
      - --upstream=static://202
      - --cookie-name=__Secure-infra_sso
      - --cookie-domain=.${SERVER_NAME}
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-expire=8h
      - --cookie-refresh=1h
      - --whitelist-domain=.${SERVER_NAME}
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --provider-ca-file=/etc/step-ca/root_ca.crt
      - --use-system-trust-store=true
    secrets:
      - oauth2_proxy_client_secret
      - oauth2_proxy_cookie_secret
    volumes:
      - ../base/traefik/certs:/etc/step-ca:ro
    networks: [infra]
    labels:
      - traefik.enable=true
      - traefik.http.routers.oauth2-proxy.rule=Host(`oauth.${SERVER_NAME}`)
      - traefik.http.routers.oauth2-proxy.entrypoints=websecure
      - traefik.http.routers.oauth2-proxy.tls=true
      - traefik.http.routers.oauth2-proxy.tls.certresolver=stepca
      - traefik.http.routers.oauth2-proxy.service=oauth2-proxy
      - traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180
      - traefik.http.middlewares.infra-sso.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth
      - traefik.http.middlewares.infra-sso.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.infra-sso.forwardauth.maxResponseBodySize=65536
      - traefik.http.middlewares.infra-sso.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups
      - traefik.http.middlewares.infra-sso.forwardauth.addAuthCookiesToResponse=__Secure-infra_sso
      - traefik.http.middlewares.infra-sso-errors.errors.status=401
      - traefik.http.middlewares.infra-sso-errors.errors.service=oauth2-proxy
      - traefik.http.middlewares.infra-sso-errors.errors.query=/oauth2/sign_in?rd={url}
      - traefik.http.middlewares.infra-sso-errors.errors.statusRewrites.401=302
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: ${OAUTH2_PROXY_MEMORY_LIMIT}
    stop_grace_period: 30s
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    depends_on:
      storage-init: {condition: service_completed_successfully}
      base-ready: {condition: service_completed_successfully}
      postgres-init: {condition: service_completed_successfully}
      keycloak-bootstrap: {condition: service_completed_successfully}
    environment:
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD__FILE: /run/secrets/grafana_db_password
      GF_DATABASE_SSL_MODE: disable
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/grafana_oidc_client_secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://keycloak.${SERVER_NAME}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://keycloak.${SERVER_NAME}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://keycloak.${SERVER_NAME}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_JWK_SET_URL: https://keycloak.${SERVER_NAME}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_VALIDATE_ID_TOKEN: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
      GF_AUTH_GENERIC_OAUTH_ALLOWED_GROUPS: /grafana-viewers /grafana-editors /grafana-admins
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], '/grafana-admins') && 'Admin' || contains(groups[*], '/grafana-editors') && 'Editor' || 'Viewer'
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_TLS_CLIENT_CA: /etc/step-ca/root_ca.crt
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_DOMAIN: grafana.${SERVER_NAME}
      GF_SERVER_ROOT_URL: https://grafana.${SERVER_NAME}/
      GF_SERVER_ENFORCE_DOMAIN: "true"
    secrets:
      - grafana_db_password
      - grafana_admin_password
      - grafana_oidc_client_secret
    volumes:
      - ${DATA_ROOT}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../base/traefik/certs:/etc/step-ca:ro
    networks: [infra]
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${SERVER_NAME}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.certresolver=stepca
      - traefik.http.routers.grafana.service=grafana
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${GRAFANA_MEMORY_LIMIT}
    logging: *default-logging

secrets:
  postgres_password:
    file: ../secrets/postgres_password
  grafana_db_password:
    file: ../secrets/grafana_db_password
  grafana_admin_password:
    file: ../secrets/grafana_admin_password
  keycloak_db_password:
    file: ../secrets/keycloak_db_password
  keycloak_config:
    file: ../secrets/keycloak.conf
  keycloak_admin_password:
    file: ../secrets/keycloak_admin_password
  keycloak_bootstrap_client_secret:
    file: ../secrets/keycloak_bootstrap_client_secret
  harbor_db_password:
    file: ../secrets/harbor_db_password
  gitlab_db_password:
    file: ../secrets/gitlab_db_password
  redis_standalone_password:
    file: ../secrets/redis_standalone_password
  gitlab_root_password:
    file: ../secrets/gitlab_root_password
  gitlab_oidc_client_secret:
    file: ../secrets/gitlab_oidc_client_secret
  grafana_oidc_client_secret:
    file: ../secrets/grafana_oidc_client_secret
  harbor_admin_password:
    file: ../secrets/harbor_admin_password
  harbor_oidc_client_secret:
    file: ../secrets/harbor_oidc_client_secret
  vault_oidc_client_secret:
    file: ../secrets/vault_oidc_client_secret
  oauth2_proxy_client_secret:
    file: ../secrets/oauth2_proxy_client_secret
  gitlab_runner_token:
    file: ../secrets/gitlab_runner_token
  oauth2_proxy_cookie_secret:
    file: ../secrets/oauth2_proxy_cookie_secret

networks:
  infra:
    external: true
    name: infra
